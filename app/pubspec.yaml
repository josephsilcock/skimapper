name: skimapper
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5
  flutter: 3.47.7

dependencies:
  clock: ^1.1.3
  crypto: ^3.0.8
  diacritic: ^0.1.6
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  http: ^1.6.0
  maplibre_gl: ^0.28.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  patrol: ^4.11.0

flutter:
  uses-material-design: true
  assets:
    - assets/map/
    - assets/glyphs/Noto Sans Regular/
    - assets/glyphs/Noto Sans Medium/
    - assets/glyphs/Noto Sans Italic/

patrol:
  app_name: skimapper
  test_directory: patrol_test
  android:
    package_name: com.skimapper.skimapper
  ios:
    bundle_id: com.skimapper.skimapper
