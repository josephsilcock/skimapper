name: toolchains
description: Node, Flutter and the endpoint's npm packages, at the versions the repo pins (.nvmrc, app/pubspec.yaml, package-lock.json)
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
    # Not subosito/flutter-action: it nests an unpinned actions/cache, which the repo's SHA-pinning policy rejects.
    - name: Install Flutter
      shell: bash
      run: |
        version=$(sed -n 's/^  flutter: *//p' app/pubspec.yaml)
        root="$RUNNER_TEMP/flutter"
        git clone --quiet --depth 1 --branch "$version" https://github.com/flutter/flutter.git "$root"
        echo "FLUTTER_ROOT=$root" >> "$GITHUB_ENV"
        { echo "$root/bin"; echo "$root/bin/cache/dart-sdk/bin"; echo "$HOME/.pub-cache/bin"; } >> "$GITHUB_PATH"
        "$root/bin/flutter" --version
    - name: Install endpoint dependencies
      shell: bash
      run: npm ci
      working-directory: endpoint
