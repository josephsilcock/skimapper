# Full sweep on demand (C5). Each job runs tools/full-sweep on its share of the layers; report combines
# their results.json against every layer, so a job that never ran shows its layers red.
name: sweep

on:
  workflow_dispatch:
  # TEMPORARY (C5 implement): workflow_dispatch only works once the workflow is on main, so trial
  # branches trigger it by push until then. Removed before /finish-feature.
  push:
    branches: ["c5-trial/**"]

permissions:
  contents: read

concurrency:
  group: sweep-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchains
      - name: Sweep
        if: ${{ !cancelled() }}
        run: tools/full-sweep --layers app,endpoint,self-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: sweep-linux
          path: test-results/sweep/
          retention-days: 14

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      ANDROID_EMULATOR_FLAGS: -no-window -gpu swiftshader_indirect -no-audio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The emulator's userdata partition needs ~7 GB more than the runner image leaves free.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost
      - uses: ./.github/actions/toolchains
      - name: Read the dev config
        id: config
        run: |
          source tools/dev.env
          {
            echo "jdk=$ANDROID_JDK_VERSION"
            echo "avd=$ANDROID_AVD"
            echo "api=$ANDROID_AVD_API"
            echo "device=$ANDROID_AVD_DEVICE"
            echo "patrol=$PATROL_CLI_VERSION"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: corretto
          java-version: ${{ steps.config.outputs.jdk }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Creates the AVD tools/dev.env names; booting it (and failing to) is the sweep's job.
      - name: Create the AVD
        env:
          AVD: ${{ steps.config.outputs.avd }}
          IMAGE: system-images;android-${{ steps.config.outputs.api }};google_apis;x86_64
          DEVICE: ${{ steps.config.outputs.device }}
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          avdmanager="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          # The runner's XDG_CONFIG_HOME sends avdmanager and the emulator to different AVD homes.
          echo "ANDROID_AVD_HOME=$HOME/.android/avd" >> "$GITHUB_ENV"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          # Patrol finds adb on PATH.
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" --install emulator "$IMAGE" > /dev/null
          echo no | "$avdmanager" create avd -n "$AVD" -k "$IMAGE" -d "$DEVICE" \
            || { echo "device profiles available:"; "$avdmanager" list device -c; exit 1; }
      - name: Install Patrol CLI
        run: dart pub global activate patrol_cli "${{ steps.config.outputs.patrol }}"
      - name: Sweep
        if: ${{ !cancelled() }}
        run: tools/full-sweep --layers e2e-android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: sweep-android
          path: test-results/sweep/
          retention-days: 14

  ios:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchains
      - name: Read the dev config
        id: config
        run: |
          source tools/dev.env
          {
            echo "simulator=$IOS_SIMULATOR"
            echo "patrol=$PATROL_CLI_VERSION"
          } >> "$GITHUB_OUTPUT"
      # Creates the simulator tools/dev.env names if the image lacks it; booting it is the sweep's job.
      - name: Create the simulator
        env:
          SIMULATOR: ${{ steps.config.outputs.simulator }}
        run: |
          if xcrun simctl list devices available | grep -q "^    $SIMULATOR ("; then
            echo "simulator '$SIMULATOR' already exists"
            exit 0
          fi
          device_type="$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; print(next((t["identifier"] for t in json.load(sys.stdin)["devicetypes"] if t["name"] == sys.argv[1]), ""))' "$SIMULATOR")"
          runtime="$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; print([r["identifier"] for r in json.load(sys.stdin)["runtimes"] if r["platform"] == "iOS" and r["isAvailable"]][-1])')"
          xcrun simctl create "$SIMULATOR" "$device_type" "$runtime"
      - name: Install Patrol CLI
        run: dart pub global activate patrol_cli "${{ steps.config.outputs.patrol }}"
      - name: Sweep
        if: ${{ !cancelled() }}
        run: tools/full-sweep --layers e2e-ios
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: sweep-ios
          path: test-results/sweep/
          retention-days: 14

  report:
    needs: [linux, android, ios]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sweep-*
          path: sweep-results
      - name: Report
        run: node tools/sweep/report.ts sweep-results
