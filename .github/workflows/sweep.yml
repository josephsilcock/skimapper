# Full sweep on every code push to main and on demand (C5). Each job runs tools/full-sweep on its share of the layers; report
# combines their results.json against every layer, so a job that never ran shows its layers red.
name: sweep

on:
  push:
    branches: [main]
    # Keep identical to push.yml's list (the sweep self-test checks).
    paths-ignore:
      - "docs/**"
      - "specs/**"
      - "**.md"
      - ".claude/**"
  workflow_dispatch:
    inputs:
      withhold_job:
        description: Withhold one job, to see its layers reported red (a check of the report itself)
        type: choice
        options: [none, linux, android, ios]
        default: none
      ios_simulator:
        description: Run iOS E2E on this simulator instead of tools/dev.env IOS_SIMULATOR
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: sweep-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    if: ${{ inputs.withhold_job != 'linux' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchains
      - name: Install status-site dependencies
        run: npm ci
        working-directory: status-site
      - name: Sweep
        if: ${{ !cancelled() }}
        run: tools/full-sweep --layers app,endpoint,self-test,status-site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: sweep-linux
          path: test-results/sweep/
          retention-days: 14
      # The status site's per-test results (C8); a re-run replaces them with its latest attempt.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: junit-linux
          path: test-results/sweep/junit/
          retention-days: 90
          overwrite: true

  android:
    if: ${{ inputs.withhold_job != 'android' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      ANDROID_EMULATOR_FLAGS: -no-window -gpu swiftshader_indirect -no-audio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The emulator's userdata partition needs ~7 GB more than the runner image leaves free.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost
      - uses: ./.github/actions/toolchains
      - name: Read the dev config
        id: config
        run: |
          source tools/dev.env
          {
            echo "jdk=$ANDROID_JDK_VERSION"
            echo "avd=$ANDROID_AVD"
            echo "api=$ANDROID_AVD_API"
            echo "device=$ANDROID_AVD_DEVICE"
            echo "patrol=$PATROL_CLI_VERSION"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: corretto
          java-version: ${{ steps.config.outputs.jdk }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Creates the AVD tools/dev.env names; booting it (and failing to) is the sweep's job.
      - name: Create the AVD
        env:
          AVD: ${{ steps.config.outputs.avd }}
          IMAGE: system-images;android-${{ steps.config.outputs.api }};google_apis;x86_64
          DEVICE: ${{ steps.config.outputs.device }}
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          avdmanager="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          # The runner's XDG_CONFIG_HOME sends avdmanager and the emulator to different AVD homes.
          echo "ANDROID_AVD_HOME=$HOME/.android/avd" >> "$GITHUB_ENV"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          # Patrol finds adb on PATH.
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" --install emulator "$IMAGE" > /dev/null
          echo no | "$avdmanager" create avd -n "$AVD" -k "$IMAGE" -d "$DEVICE" \
            || { echo "device profiles available:"; "$avdmanager" list device -c; exit 1; }
      # The app's gradle.properties asks for an 8 GB heap, which leaves no room for the emulator's 4 GB
      # beside it. Gradle's user-home properties take precedence over the project's.
      - name: Fit Gradle beside the emulator
        run: |
          mkdir -p ~/.gradle
          {
            echo "org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g"
            echo "kotlin.daemon.jvmargs=-Xmx1g"
          } >> ~/.gradle/gradle.properties
      - name: Install Patrol CLI
        env:
          PATROL_CLI_VERSION: ${{ steps.config.outputs.patrol }}
        run: dart pub global activate patrol_cli "$PATROL_CLI_VERSION"
      - name: Sweep
        if: ${{ !cancelled() }}
        run: tools/full-sweep --layers e2e-android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: sweep-android
          path: test-results/sweep/
          retention-days: 14
      # The status site's per-test results (C8); a re-run replaces them with its latest attempt.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: junit-android
          path: test-results/sweep/junit/
          retention-days: 90
          overwrite: true

  ios:
    if: ${{ inputs.withhold_job != 'ios' }}
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      # Empty unless the manual run overrides it; tools/dev.env treats empty as its default.
      IOS_SIMULATOR: ${{ inputs.ios_simulator }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchains
      - name: Read the dev config
        id: config
        run: |
          source tools/dev.env
          {
            echo "simulator=$IOS_SIMULATOR"
            echo "patrol=$PATROL_CLI_VERSION"
          } >> "$GITHUB_OUTPUT"
      # Creates the simulator tools/dev.env names if the image lacks it; booting it is the sweep's job.
      - name: Create the simulator
        env:
          SIMULATOR: ${{ steps.config.outputs.simulator }}
        run: |
          if xcrun simctl list devices available | grep -q "^    $SIMULATOR ("; then
            echo "simulator '$SIMULATOR' already exists"
            exit 0
          fi
          device_type="$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; print(next((t["identifier"] for t in json.load(sys.stdin)["devicetypes"] if t["name"] == sys.argv[1]), ""))' "$SIMULATOR")"
          runtime="$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; print([r["identifier"] for r in json.load(sys.stdin)["runtimes"] if r["platform"] == "iOS" and r["isAvailable"]][-1])')"
          xcrun simctl create "$SIMULATOR" "$device_type" "$runtime"
      - name: Install Patrol CLI
        env:
          PATROL_CLI_VERSION: ${{ steps.config.outputs.patrol }}
        run: dart pub global activate patrol_cli "$PATROL_CLI_VERSION"
      - name: Sweep
        if: ${{ !cancelled() }}
        run: tools/full-sweep --layers e2e-ios
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: sweep-ios
          path: test-results/sweep/
          retention-days: 14
      # The status site's per-test results (C8); a re-run replaces them with its latest attempt.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: junit-ios
          path: test-results/sweep/junit/
          retention-days: 90
          overwrite: true

  report:
    needs: [linux, android, ios]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sweep-*
          path: sweep-results
      - name: Report
        run: node tools/sweep/report.ts sweep-results
