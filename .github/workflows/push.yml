# Fast checks on every code push (C5). Test commands live in tools/full-sweep, never here.
name: push

on:
  push:
    paths-ignore:
      - "docs/**"
      - "specs/**"
      - "**.md"
      - ".claude/**"

permissions:
  contents: read

concurrency:
  group: push-${{ github.ref }}
  cancel-in-progress: true

env:
  FAST_LAYERS: app,endpoint,self-test

jobs:
  fast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: app/pubspec.yaml
      - name: Install endpoint dependencies
        run: npm ci
        working-directory: endpoint
      # Runner preparation failing must not hide the sweep: its own red names the layer.
      - name: Sweep
        if: ${{ !cancelled() }}
        run: tools/full-sweep --layers "$FAST_LAYERS"
      - name: Report
        if: ${{ !cancelled() }}
        run: node tools/sweep/report.ts --expect "$FAST_LAYERS" test-results/sweep
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: sweep-fast
          path: test-results/sweep/
          retention-days: 14
