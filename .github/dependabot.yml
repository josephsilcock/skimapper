version: 2

# Version updates are weekly, grouped, and held back 7 days after release.
# Security updates ignore the cooldown and arrive as soon as an advisory lands.
updates:
  - package-ecosystem: npm
    directory: /endpoint
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(deps)
    groups:
      endpoint-security:
        applies-to: security-updates
        patterns: ["*"]
      endpoint:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(deps)
    groups:
      app-security:
        applies-to: security-updates
        patterns: ["*"]
      app:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /app/android
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(deps)
    groups:
      android-security:
        applies-to: security-updates
        patterns: ["*"]
      android:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ["*"]
